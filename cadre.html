<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maria Bag — Cadre QR (impression Forex)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  /* Format du cadre : 20 x 30 cm (modifiable ci-dessous) */
  @page{size:200mm 300mm;margin:0}
  :root{--ink:#111;--cream:#ffffff;--gold:#111111;--muted:#555555}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',sans-serif;background:#d8d2ca;display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px}

  .tools{background:#fff;padding:14px 18px;border-radius:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;max-width:760px;width:100%;box-shadow:0 4px 14px rgba(0,0,0,.08);font-size:.85rem}
  .tools input{flex:1;min-width:240px;padding:8px 10px;border:1px solid #ccc;border-radius:8px;font:inherit}
  .tools button{padding:8px 14px;border-radius:8px;border:0;background:var(--ink);color:#fff;font:inherit;cursor:pointer}
  .tools p{width:100%;color:#666;font-size:.78rem}

  .poster{
    width:200mm;height:300mm;background:#fff;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:26mm 20mm 20mm;box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  /* one thin black frame */
  .poster::before{content:"";position:absolute;inset:9mm;border:.5mm solid var(--ink);pointer-events:none}

  .top{text-align:center}
  .top img{width:62mm;height:auto;display:block;margin:0 auto}
  .welcome{font-family:'Cormorant Garamond',serif;font-size:14mm;font-weight:500;line-height:1;margin-top:9mm;letter-spacing:.01em}
  .rule{width:18mm;height:.4mm;background:var(--ink);margin:5mm auto 0}

  .qr-box{text-align:center}
  .qr{width:100mm;height:100mm;position:relative}
  .qr svg{width:100%;height:100%;display:block}
  .qr .center{position:absolute;left:50%;top:50%;width:22mm;height:22mm;transform:translate(-50%,-50%);background:#fff;display:grid;place-items:center}
  .qr .center img{width:18mm}
  .cta{margin-top:8mm;font-size:5.6mm;font-weight:600;letter-spacing:.35em;padding-left:.35em}
  .cta span{display:block;font-weight:300;font-size:3.8mm;color:var(--muted);letter-spacing:.08em;margin-top:2.5mm;padding:0}

  .bottom{text-align:center}
  .icons{display:flex;gap:6mm;justify-content:center}
  .icons div{width:11mm;height:11mm;border-radius:50%;border:.4mm solid var(--ink);display:grid;place-items:center}
  .icons svg{width:5.4mm;height:5.4mm;fill:var(--ink)}
  .site{font-size:3.8mm;letter-spacing:.22em;color:var(--ink);font-weight:500;margin-top:7mm}

  @media print{
    body{background:none;padding:0;display:block}
    .tools{display:none}
    .poster{box-shadow:none}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>

<div class="tools">
  <input id="url" placeholder="Lien de la page (ex: https://maria-bag.onrender.com)">
  <button id="apply">Mettre à jour le QR</button>
  <button id="print">Imprimer / PDF</button>
  <button id="svg">Télécharger QR (SVG)</button>
  <p>Format 20 × 30 cm pour impression Forex. Dans la fenêtre d'impression : « Enregistrer en PDF », marges « Aucune », échelle 100 %, cocher « Graphiques d'arrière-plan ».</p>
</div>

<section class="poster" id="poster">
  <div class="top">
    <img src="logo.png" alt="Maria Bag">
    <div class="welcome">Bienvenue</div>
    <div class="rule"></div>
  </div>

  <div class="qr-box">
    <div class="qr" id="qr"></div>
    <div class="cta">SCANNEZ-MOI<span>WhatsApp · Instagram · Facebook · TikTok · Boutique</span></div>
  </div>

  <div class="bottom">
  <div class="icons">
    <div><svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.8.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8zM12 0a12 12 0 0 0-10.3 18L0 24l6.2-1.6A12 12 0 1 0 12 0z"/></svg></div>
    <div><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 3.9 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zm0 3.6a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9z"/></svg></div>
    <div><svg viewBox="0 0 24 24"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4h-3V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg></div>
    <div><svg viewBox="0 0 24 24"><path d="M19.6 6.7a4.8 4.8 0 0 1-3.8-4.2V2h-3.4v13.4a2.9 2.9 0 0 1-5.2 1.7 2.9 2.9 0 0 1 3.2-4.5V9.2a6.3 6.3 0 0 0-5.4 10.7 6.3 6.3 0 0 0 10.8-4.4V8.7a8.2 8.2 0 0 0 4.8 1.5V6.8l-1-.1z"/></svg></div>
    <div><svg viewBox="0 0 24 24"><path d="M7 7V6a5 5 0 0 1 10 0v1h3l-1 14H5L4 7h3zm2 0h6V6a3 3 0 0 0-6 0v1z"/></svg></div>
  </div>

  <div class="site">MARIABAG.COM &nbsp;·&nbsp; WHATSAPP 0549 69 16 54</div>
  </div>
</section>

<script>
  // URL encodée dans le QR : ?url=... sinon la page d'accueil du même site
  const params = new URLSearchParams(location.search);
  const sameSite = location.protocol.startsWith('http') ? location.origin + '/' : 'https://maria-bag.onrender.com/';
  const input = document.getElementById('url');
  input.value = params.get('url') || sameSite;

  function draw(){
    const qr = qrcode(0, 'H');           // correction H : supporte le logo au centre
    qr.addData(input.value.trim());
    qr.make();
    const box = document.getElementById('qr');
    box.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true }) +
      '<div class="center"><img src="logo.png" alt=""></div>';
    box.querySelector('svg').querySelector('path').setAttribute('fill', '#111');
  }
  draw();
  document.getElementById('apply').onclick = draw;
  document.getElementById('print').onclick = () => window.print();
  document.getElementById('svg').onclick = () => {
    const svg = document.querySelector('#qr svg').outerHTML;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    a.download = 'maria-bag-qr.svg'; a.click();
  };
</script>
</body>
</html>
