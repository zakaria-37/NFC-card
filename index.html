<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maria Bag — Tous nos réseaux</title>
<meta name="description" content="Retrouvez Maria Bag sur Facebook, Instagram, TikTok et notre boutique en ligne.">
<meta name="theme-color" content="#111111">
<meta property="og:title" content="Maria Bag — Tous nos réseaux">
<meta property="og:description" content="Sacs & accessoires — suivez-nous partout.">
<meta property="og:image" content="logo.png">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111; --cream:#f6f1ea; --sand:#e9dfd2; --gold:#b8925a; --muted:#6d655c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Poppins',system-ui,sans-serif;color:var(--ink);
    background:var(--cream);
    display:flex;justify-content:center;
    padding:40px 18px 32px;
    overflow-x:hidden;
  }
  /* soft animated background blobs */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg span{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 18s ease-in-out infinite}
  .bg span:nth-child(1){width:380px;height:380px;background:#e7d3b6;top:-120px;left:-100px}
  .bg span:nth-child(2){width:320px;height:320px;background:#d9c7b5;bottom:-100px;right:-80px;animation-delay:-6s}
  .bg span:nth-child(3){width:220px;height:220px;background:#f1e4cf;top:40%;left:60%;animation-delay:-12s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.12)}}

  main{width:100%;max-width:460px;text-align:center}

  .logo-wrap{
    width:132px;height:132px;margin:0 auto 18px;border-radius:50%;
    background:#fff;display:grid;place-items:center;
    box-shadow:0 0 0 6px rgba(255,255,255,.6),0 0 0 7px var(--gold),0 18px 40px rgba(17,17,17,.14);
    animation:pop .8s cubic-bezier(.2,1.4,.4,1) both;
  }
  .logo-wrap img{width:92px;height:auto}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2.4rem;letter-spacing:.02em;line-height:1}
  .tag{margin:8px 0 6px;color:var(--muted);font-size:.92rem;font-weight:300;letter-spacing:.04em}
  .divider{width:56px;height:2px;background:var(--gold);margin:16px auto 26px;border-radius:2px}

  .links{display:flex;flex-direction:column;gap:14px}
  .link{
    --c:#111;
    position:relative;display:flex;align-items:center;gap:14px;
    padding:14px 18px;border-radius:18px;text-decoration:none;color:var(--ink);
    background:rgba(255,255,255,.78);backdrop-filter:blur(8px);
    border:1px solid rgba(17,17,17,.08);
    box-shadow:0 6px 18px rgba(17,17,17,.06);
    transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease;
    overflow:hidden;opacity:0;transform:translateY(18px);
    animation:rise .6s ease forwards;
  }
  .link:nth-child(1){animation-delay:.15s}.link:nth-child(2){animation-delay:.27s}
  .link:nth-child(3){animation-delay:.39s}.link:nth-child(4){animation-delay:.51s}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .link::before{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .35s ease;z-index:0}
  .link:hover,.link:focus-visible{transform:translateY(-3px);box-shadow:0 14px 30px rgba(17,17,17,.14);color:#fff;outline:none}
  .link:hover::before,.link:focus-visible::before{transform:scaleX(1)}
  .link>*{position:relative;z-index:1}
  .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;flex-shrink:0;transition:background .3s}
  .link:hover .ico{background:rgba(255,255,255,.18)}
  .ico svg{width:24px;height:24px;fill:currentColor}
  .txt{flex:1;text-align:left;line-height:1.25}
  .txt b{display:block;font-weight:600;font-size:1rem}
  .txt small{color:var(--muted);font-size:.78rem;transition:color .25s}
  .link:hover small{color:rgba(255,255,255,.8)}
  .arrow{width:18px;height:18px;opacity:.5;transition:transform .25s,opacity .25s}
  .link:hover .arrow{transform:translateX(4px);opacity:1}

  .fb{--c:#1877f2}
  .ig{--c:linear-gradient(45deg,#f58529,#dd2a7b 45%,#8134af 75%,#515bd4)}
  .ig .ico{background:linear-gradient(45deg,#f58529,#dd2a7b 45%,#8134af 75%,#515bd4)}
  .ig::before{background:linear-gradient(45deg,#f58529,#dd2a7b 45%,#8134af 75%,#515bd4)}
  .tt{--c:#111}
  .web{--c:var(--gold)}
  .web.featured{border:1px solid var(--gold)}

  .actions{margin-top:26px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .btn{
    font:inherit;font-size:.82rem;cursor:pointer;border:1px solid rgba(17,17,17,.15);
    background:transparent;color:var(--ink);padding:9px 16px;border-radius:999px;
    display:inline-flex;align-items:center;gap:8px;transition:background .2s,color .2s
  }
  .btn:hover{background:var(--ink);color:#fff}
  .btn svg{width:16px;height:16px;fill:currentColor}

  footer{margin-top:30px;font-size:.75rem;color:var(--muted);letter-spacing:.05em}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.85rem;transition:transform .3s}
  .toast.show{transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.link{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><span></span><span></span><span></span></div>

<main>
  <div class="logo-wrap"><img src="logo.png" alt="Logo Maria Bag"></div>
  <h1>Maria Bag</h1>
  <p class="tag">Sacs &amp; accessoires · Élégance au quotidien</p>
  <div class="divider"></div>

  <nav class="links">
    <a class="link web featured" href="https://mariabag.com/" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M7 7V6a5 5 0 0 1 10 0v1h3l-1 14H5L4 7h3zm2 0h6V6a3 3 0 0 0-6 0v1z"/></svg></span>
      <span class="txt"><b>Boutique en ligne</b><small>mariabag.com — commandez maintenant</small></span>
      <svg class="arrow" viewBox="0 0 24 24" fill="currentColor"><path d="M9 6l6 6-6 6-1.4-1.4L12.2 12 7.6 7.4z"/></svg>
    </a>
    <a class="link ig" href="https://www.instagram.com/maria_._bag/" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 3.9 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7 1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9z"/></svg></span>
      <span class="txt"><b>Instagram</b><small>@maria_._bag</small></span>
      <svg class="arrow" viewBox="0 0 24 24" fill="currentColor"><path d="M9 6l6 6-6 6-1.4-1.4L12.2 12 7.6 7.4z"/></svg>
    </a>
    <a class="link fb" href="https://www.facebook.com/Mariabag16" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4h-3V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg></span>
      <span class="txt"><b>Facebook</b><small>Mariabag16</small></span>
      <svg class="arrow" viewBox="0 0 24 24" fill="currentColor"><path d="M9 6l6 6-6 6-1.4-1.4L12.2 12 7.6 7.4z"/></svg>
    </a>
    <a class="link tt" href="https://www.tiktok.com/@maria.bag4" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M19.6 6.7a4.8 4.8 0 0 1-3.8-4.2V2h-3.4v13.4a2.9 2.9 0 0 1-5.2 1.7 2.9 2.9 0 0 1 3.2-4.5V9.2a6.3 6.3 0 0 0-5.4 10.7 6.3 6.3 0 0 0 10.8-4.4V8.7a8.2 8.2 0 0 0 4.8 1.5V6.8l-1-.1z"/></svg></span>
      <span class="txt"><b>TikTok</b><small>@maria.bag4</small></span>
      <svg class="arrow" viewBox="0 0 24 24" fill="currentColor"><path d="M9 6l6 6-6 6-1.4-1.4L12.2 12 7.6 7.4z"/></svg>
    </a>
  </nav>

  <div class="actions">
    <button class="btn" id="share"><svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.3L15 17a3 3 0 1 0 3-1z"/></svg>Partager</button>
    <button class="btn" id="copy"><svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>Copier le lien</button>
  </div>

  <footer>© <span id="y"></span> Maria Bag · Merci de votre visite ♡</footer>
</main>
<div class="toast" id="toast">Lien copié ✓</div>

<script>
  document.getElementById('y').textContent = new Date().getFullYear();
  const toast = msg => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); };
  const url = location.href.split('#')[0];
  document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(url); toast('Lien copié ✓'); } catch { toast(url); }
  };
  document.getElementById('share').onclick = async () => {
    if (navigator.share) { try { await navigator.share({ title:'Maria Bag', text:'Retrouvez Maria Bag sur tous ses réseaux', url }); } catch {} }
    else document.getElementById('copy').click();
  };
</script>
</body>
</html>
